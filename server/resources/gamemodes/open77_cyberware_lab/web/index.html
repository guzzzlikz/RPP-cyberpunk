<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open77 Cyberware Lab</title>
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="panel" role="dialog" aria-modal="true" aria-label="Кибер-лаборатория" hidden>
    <header class="bar">
      <div class="brand">ОТКРЫТЬ<span>//</span>77 <b>КИБЕРЛАБ</b></div>
      <div class="bar-actions"><button id="show-dash" type="button" aria-controls="dash">Рывок &darr;</button><button id="show-slam" type="button" aria-controls="slam">Удар о землю &darr;</button><button id="show-reflex" type="button" aria-controls="reflex">Овердрайв &darr;</button><button id="refresh" type="button">Обновить</button><button id="close" type="button" aria-label="Закрыть кибер-лабораторию">ESC &times;</button></div>
    </header>
    <div class="workspace">
      <aside class="roster">
        <div class="eyebrow">Выбрать игрока</div>
        <button id="self" type="button" class="self">Мои импланты</button>
        <label class="search-label" for="search">Игроки онлайн <span id="count">0</span></label>
        <input id="search" type="search" placeholder="Поиск по имени или ID" autocomplete="off" maxlength="80">
        <div id="players" class="players" aria-label="Игроки онлайн"></div>
      </aside>
      <section class="content" tabindex="0" aria-label="Импланты и способности">
        <div class="target-heading"><div><div class="eyebrow">Мастерская имплантов</div><h1 id="target-name">Загрузка игрока</h1><p id="target-detail">Выбери имплант и уровень ниже.</p></div><span id="readiness" class="badge">Загрузка</span></div>
        <div id="implants" class="implants"></div>
        <p class="help">Установи уровень, и имплант сразу заработает. Руки и ноги можно ставить вместе.</p>
        <section id="slam" class="slam" aria-label="Способность «Удар о землю»"></section>
        <section id="reflex" class="reflex" aria-label="Способность «Овердрайв»"></section>
        <section id="dash" class="dash" aria-label="Способность «Рывок»"></section>
      </section>
    </div>
    <footer><div id="status" role="status" aria-live="polite">Выбери имплант, чтобы начать.</div><span>ESC — ВЕРНУТЬСЯ В ИГРУ</span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
